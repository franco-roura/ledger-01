<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>Ledger/01 social preview</title>
  <!-- GitHub social preview (1280×640). Everything sits inside a 40 px safe border. Colors are
       packages/ui tokens; the device is docs/brand/icon.svg scaled into the studio tile. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&amp;family=Michroma&amp;family=Space+Mono:wght@400;700&amp;display=block');
      .hud { font-family: 'Space Mono', monospace; letter-spacing: 0.16em; }
      .chip { font-family: 'Space Mono', monospace; letter-spacing: 0.12em; font-weight: 700; }
      .disp { font-family: 'Michroma', sans-serif; }
      .body { font-family: 'Manrope', sans-serif; font-weight: 500; }
    </style>
    <filter id="float" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1e21" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="48" stdDeviation="40" flood-color="#1c1e21" flood-opacity="0.16" />
    </filter>
    <filter id="mold" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1c1e21" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1c1e21" flood-opacity="0.12" />
    </filter>
    <filter id="chipmold" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1c1e21" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1c1e21" flood-opacity="0.08" />
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c7d6" />
      <stop offset="1" stop-color="#b9bccd" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="screen">
      <rect x="248" y="300" width="528" height="268" rx="36" />
    </clipPath>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd9c7" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffd9c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas and HUD frame (inside the 40 px safe border) -->
  <rect width="1280" height="640" fill="#f3f4f6" />
  <g stroke="#7c818a" stroke-width="3" fill="none" stroke-linecap="square">
    <path d="M56 92 V56 H92" />
    <path d="M1188 56 H1224 V92" />
    <path d="M56 548 V584 H92" />
    <path d="M1224 548 V584 H1188" />
  </g>

  <!-- The app icon in its studio tile -->
  <g transform="translate(96 96) scale(0.4375)">
    <rect width="1024" height="1024" rx="224" fill="url(#tile)" />
    <path filter="url(#float)" fill="#ffffff"
      d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
    <path fill="url(#sheen)"
      d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
    <path fill="none" stroke="#c9ccd2" stroke-width="2"
      d="M268 220 H732 L816 304 V744 Q816 820 740 820 H284 Q208 820 208 744 V296 Q208 220 284 220 Z" />
    <circle cx="700" cy="264" r="7" fill="#1fa45a" />
    <circle cx="700" cy="264" r="14" fill="#1fa45a" opacity="0.18" />
    <rect x="248" y="300" width="528" height="268" rx="36" fill="#1c1e21" />
    <g clip-path="url(#screen)">
      <g stroke="#a3a7ae" stroke-opacity="0.22" stroke-width="2">
        <line x1="248" y1="366" x2="776" y2="366" />
        <line x1="248" y1="434" x2="776" y2="434" />
        <line x1="248" y1="502" x2="776" y2="502" />
      </g>
      <path d="M248 520 L300 506 L340 512 L390 470 L430 482 L480 448 L530 456 L570 410 L620 424 L668 380 L712 392 L776 372"
        fill="none" stroke="#ff5f1f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
      <path d="M248 520 L300 506 L340 512 L390 470 L430 482 L480 448 L530 456 L570 410 L620 424 L668 380 L712 392 L776 372 V568 H248 Z"
        fill="#ff5f1f" opacity="0.12" />
      <circle cx="712" cy="392" r="40" fill="url(#halo)" />
      <circle cx="712" cy="392" r="12" fill="#ff5f1f" />
      <circle cx="712" cy="392" r="5" fill="#1c1e21" />
    </g>
    <g filter="url(#mold)">
      <path fill="#ff5f1f" d="M276 600 H556 Q584 600 584 628 V744 Q584 772 556 772 H276 Q248 772 248 744 V628 Q248 600 276 600 Z" />
    </g>
    <path fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" d="M268 602 H564" stroke-linecap="round" />
    <text x="280" y="708" class="disp" font-size="52" fill="#1c1e21">L/01</text>
    <g fill="#d94a12">
      <rect x="488" y="628" width="12" height="116" rx="6" />
      <rect x="516" y="628" width="12" height="116" rx="6" />
      <rect x="544" y="628" width="12" height="116" rx="6" />
    </g>
    <g filter="url(#mold)">
      <rect x="616" y="600" width="160" height="72" rx="36" fill="#ffffff" stroke="#c9ccd2" stroke-width="2" />
      <rect x="616" y="700" width="160" height="72" rx="36" fill="#e7e9ec" />
    </g>
    <text x="696" y="652" class="disp" font-size="44" fill="#0f6e38" text-anchor="middle">+</text>
    <text x="696" y="752" class="disp" font-size="44" fill="#b42318" text-anchor="middle">−</text>
  </g>

  <!-- Copy -->
  <g>
    <rect x="608" y="128" width="64" height="30" rx="15" fill="#ff5f1f" />
    <text x="640" y="149" class="hud" font-size="16" fill="#1c1e21" text-anchor="middle" font-weight="700">S-00</text>
    <text x="688" y="149" class="hud" font-size="16" fill="#53575e">SELF-HOSTED · OPEN SOURCE</text>

    <text x="606" y="244" class="disp" font-size="58" fill="#1c1e21">Ledger/01</text>

    <text class="body" font-size="28" fill="#53575e">
      <tspan x="608" y="304">Personal and household finance,</tspan>
      <tspan x="608" y="342">on your own AWS account.</tspan>
    </text>
  </g>

  <!-- Feature chips -->
  <g filter="url(#chipmold)">
    <rect x="608" y="384" width="196" height="40" rx="20" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5" />
    <rect x="816" y="384" width="120" height="40" rx="20" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5" />
    <rect x="948" y="384" width="168" height="40" rx="20" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5" />
    <rect x="608" y="436" width="238" height="40" rx="20" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5" />
    <rect x="858" y="436" width="222" height="40" rx="20" fill="#ffd9c7" />
  </g>
  <g class="chip" font-size="15" fill="#1c1e21" text-anchor="middle">
    <text x="706" y="409">MULTI-CURRENCY</text>
    <text x="876" y="409">BUDGETS</text>
    <text x="1032" y="409">BANK IMPORT</text>
    <text x="727" y="461">SHARED HOUSEHOLDS</text>
    <text x="969" y="461">ASK CLAUDE · MCP</text>
  </g>

  <!-- Footer microprint and tick ruler -->
  <g fill="#7c818a">
    <rect x="608" y="530" width="3" height="14" />
    <rect x="632" y="535" width="3" height="9" />
    <rect x="656" y="535" width="3" height="9" />
    <rect x="680" y="535" width="3" height="9" />
    <rect x="704" y="530" width="3" height="14" />
    <rect x="728" y="535" width="3" height="9" />
    <rect x="752" y="535" width="3" height="9" />
    <rect x="776" y="535" width="3" height="9" />
    <rect x="800" y="530" width="3" height="14" />
  </g>
  <text x="1184" y="544" class="hud" font-size="16" fill="#53575e" text-anchor="end">FRANCO-ROURA/LEDGER-01</text>
</svg>
